<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop admin</title>
<style>
:root{--bg:#eef1ef;--card:#fff;--ink:#16211d;--mute:#5d6b65;--line:#d5ddd9;--acc:#e0a800;--accink:#1c1600;--bad:#b3261e;--ok:#1b7f4b}
:root[data-theme=dark]{--bg:#11171a;--card:#1a2327;--ink:#e8eeea;--mute:#98a8a1;--line:#2c3a40;--acc:#f0bc2a;--accink:#1c1600;--bad:#ff8a80;--ok:#6fd49c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px}
nav button{border:0;background:none;color:var(--mute);padding:10px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);color:var(--accink)}
main{max-width:860px;margin:0 auto;padding:8px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
h2{font-size:17px;margin:4px 0 10px}h3{font-size:15px;margin:16px 0 6px;color:var(--mute)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:110px}
button.b{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:var(--accink)}
button.g{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:0}.item .n{flex:1;min-width:150px}.item small{color:var(--mute);display:block}
.low{color:var(--bad);font-weight:700}.off{opacity:.5}
.big{font-size:26px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stats div{background:var(--bg);border-radius:8px;padding:10px}.stats span{font-size:13px;color:var(--mute)}
.empty{color:var(--mute);padding:18px 0;text-align:center}
#login{max-width:340px;margin:12vh auto;padding:0 16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="login" hidden><div class="card"><h2>Sign in</h2>
<label for="em">Email</label><input id="em" type="email" autocomplete="username">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<p id="lm" class="low"></p><button class="b" id="go" style="width:100%">Sign in</button></div></div>
<div id="app" hidden>
<header><h1 id="biz">Shop admin</h1><button class="g" id="tg">Light / dark</button></header>
<nav id="tabs"></nav><main id="view"></main></div>

<script>
firebase.initializeApp({

const STARTER=[{"id":"chi0","cat":"Chips","grp":"Chips","size":"Small","name":"Small Chips","price":20},{"id":"chi1","cat":"Chips","grp":"Chips","size":"Medium","name":"Medium Chips","price":25},{"id":"chi2","cat":"Chips","grp":"Chips","size":"Large","name":"Large Chips","price":30},{"id":"chi3","cat":"Chips","name":"Loaded Fries","price":40},{"id":"sav0","cat":"Savoury","name":"Russian","price":15},{"id":"sav1","cat":"Savoury","name":"Russian & Chips","price":25},{"id":"sav2","cat":"Savoury","name":"Fish & Chips","price":50},{"id":"sav3","cat":"Savoury","name":"Wings & Chips","price":50},{"id":"sav4","cat":"Savoury","name":"Kota","price":50},{"id":"bur0","cat":"Burgers","name":"Special Pink Sauce Burger","price":45},{"id":"bur1","cat":"Burgers","name":"Bacon & Cheese Burger","price":45},{"id":"bur2","cat":"Burgers","name":"Jalapeño Burger","price":45},{"id":"sch0","cat":"Schnitzel","name":"Schnitzel & Chips","price":45},{"id":"cro0","cat":"Croissants","name":"Cheese & Ham","price":30},{"id":"cro1","cat":"Croissants","name":"Bacon, Feta & Avo","price":35},{"id":"cro2","cat":"Croissants","name":"Cheese & Egg","price":30},{"id":"toa0","cat":"Toasties","name":"Chicken Mayo","price":25,"bread":true},{"id":"toa1","cat":"Toasties","name":"Cheese & Tomato","price":25,"bread":true},{"id":"toa2","cat":"Toasties","name":"Cheesy Toastie","price":20,"bread":true},{"id":"toa3","cat":"Toasties","name":"Bacon & Cheese","price":30,"bread":true},{"id":"toa4","cat":"Toasties","name":"Vegan Toastie","price":30,"bread":true},{"id":"mag0","cat":"Magwinya","grp":"Magwinya (each)","name":"Magwinya (each)","price":2},{"id":"dri0","cat":"Drinks","grp":"Coke","size":"330ml","name":"Drink: Coke 330ml","price":15},{"id":"dri1","cat":"Drinks","grp":"Coke","size":"500ml","name":"Drink: Coke 500ml","price":20},{"id":"dri2","cat":"Drinks","grp":"Coke","size":"1 litre","name":"Drink: Coke 1L","price":28},{"id":"dri3","cat":"Drinks","grp":"Coke","size":"2 litre","name":"Drink: Coke 2L","price":38},{"id":"dri4","cat":"Drinks","grp":"Fanta Orange","size":"330ml","name":"Drink: Fanta Orange 330ml","price":15},{"id":"dri5","cat":"Drinks","grp":"Fanta Orange","size":"500ml","name":"Drink: Fanta Orange 500ml","price":20},{"id":"dri6","cat":"Drinks","grp":"Fanta Orange","size":"1 litre","name":"Drink: Fanta Orange 1L","price":28},{"id":"dri7","cat":"Drinks","grp":"Fanta Orange","size":"2 litre","name":"Drink: Fanta Orange 2L","price":38},{"id":"dri8","cat":"Drinks","grp":"Sprite","size":"330ml","name":"Drink: Sprite 330ml","price":15},{"id":"dri9","cat":"Drinks","grp":"Sprite","size":"500ml","name":"Drink: Sprite 500ml","price":20},{"id":"dri10","cat":"Drinks","grp":"Sprite","size":"1 litre","name":"Drink: Sprite 1L","price":28},{"id":"dri11","cat":"Drinks","grp":"Sprite","size":"2 litre","name":"Drink: Sprite 2L","price":38},{"id":"dri12","cat":"Drinks","grp":"Water","name":"Drink: Water","price":10},{"id":"smo0","cat":"Smoothies","grp":"Strawberry smoothie","size":"350ml","name":"Smoothie: Strawberry smoothie 350ml","price":45},{"id":"smo1","cat":"Smoothies","grp":"Strawberry smoothie","size":"500ml","name":"Smoothie: Strawberry smoothie 500ml","price":55},{"id":"smo2","cat":"Smoothies","grp":"Peanut butter & banana","size":"350ml","name":"Smoothie: Peanut butter & banana 350ml","price":50},{"id":"smo3","cat":"Smoothies","grp":"Peanut butter & banana","size":"500ml","name":"Smoothie: Peanut butter & banana 500ml","price":60},{"id":"smo4","cat":"Smoothies","grp":"Blueberry smoothie","size":"350ml","name":"Smoothie: Blueberry smoothie 350ml","price":55},{"id":"smo5","cat":"Smoothies","grp":"Blueberry smoothie","size":"500ml","name":"Smoothie: Blueberry smoothie 500ml","price":65},{"id":"smo6","cat":"Smoothies","grp":"Strawberry & banana","size":"350ml","name":"Smoothie: Strawberry & banana 350ml","price":45},{"id":"smo7","cat":"Smoothies","grp":"Strawberry & banana","size":"500ml","name":"Smoothie: Strawberry & banana 500ml","price":55},{"id":"smo8","cat":"Smoothies","grp":"Mixed berry smoothie","size":"350ml","name":"Smoothie: Mixed berry smoothie 350ml","price":55},{"id":"smo9","cat":"Smoothies","grp":"Mixed berry smoothie","size":"500ml","name":"Smoothie: Mixed berry smoothie 500ml","price":65},{"id":"smo10","cat":"Smoothies","grp":"Mango & apple smoothie","size":"350ml","name":"Smoothie: Mango & apple smoothie 350ml","price":45},{"id":"smo11","cat":"Smoothies","grp":"Mango & apple smoothie","size":"500ml","name":"Smoothie: Mango & apple smoothie 500ml","price":55},{"id":"smo12","cat":"Smoothies","grp":"Coconut butter smoothie","size":"350ml","name":"Smoothie: Coconut butter smoothie 350ml","price":50},{"id":"smo13","cat":"Smoothies","grp":"Coconut butter smoothie","size":"500ml","name":"Smoothie: Coconut butter smoothie 500ml","price":55},{"id":"mil0","cat":"Milkshakes","grp":"Blueberry","size":"350ml","name":"Milkshake: Blueberry 350ml","price":40},{"id":"mil1","cat":"Milkshakes","grp":"Blueberry","size":"500ml","name":"Milkshake: Blueberry 500ml","price":50},{"id":"mil2","cat":"Milkshakes","grp":"Strawberry","size":"350ml","name":"Milkshake: Strawberry 350ml","price":40},{"id":"mil3","cat":"Milkshakes","grp":"Strawberry","size":"500ml","name":"Milkshake: Strawberry 500ml","price":50},{"id":"mil4","cat":"Milkshakes","grp":"Lime","size":"350ml","name":"Milkshake: Lime 350ml","price":40},{"id":"mil5","cat":"Milkshakes","grp":"Lime","size":"500ml","name":"Milkshake: Lime 500ml","price":50},{"id":"mil6","cat":"Milkshakes","grp":"Chocolate","size":"350ml","name":"Milkshake: Chocolate 350ml","price":40},{"id":"mil7","cat":"Milkshakes","grp":"Chocolate","size":"500ml","name":"Milkshake: Chocolate 500ml","price":50},{"id":"mil8","cat":"Milkshakes","grp":"Bubblegum","size":"350ml","name":"Milkshake: Bubblegum 350ml","price":40},{"id":"mil9","cat":"Milkshakes","grp":"Bubblegum","size":"500ml","name":"Milkshake: Bubblegum 500ml","price":50},{"id":"coo0","cat":"Coolers","grp":"Lemonade & mint","size":"350ml","name":"Cooler: Lemonade & mint 350ml","price":35},{"id":"coo1","cat":"Coolers","grp":"Lemonade & mint","size":"500ml","name":"Cooler: Lemonade & mint 500ml","price":45},{"id":"coo2","cat":"Coolers","grp":"Granadilla","size":"350ml","name":"Cooler: Granadilla 350ml","price":35},{"id":"coo3","cat":"Coolers","grp":"Granadilla","size":"500ml","name":"Cooler: Granadilla 500ml","price":45},{"id":"coo4","cat":"Coolers","grp":"Raspberry","size":"350ml","name":"Cooler: Raspberry 350ml","price":35},{"id":"coo5","cat":"Coolers","grp":"Raspberry","size":"500ml","name":"Cooler: Raspberry 500ml","price":45},{"id":"coo6","cat":"Coolers","grp":"Strawberry","size":"350ml","name":"Cooler: Strawberry 350ml","price":35},{"id":"coo7","cat":"Coolers","grp":"Strawberry","size":"500ml","name":"Cooler: Strawberry 500ml","price":45},{"id":"coo8","cat":"Coolers","grp":"Passion fruit","size":"350ml","name":"Cooler: Passion fruit 350ml","price":35},{"id":"coo9","cat":"Coolers","grp":"Passion fruit","size":"500ml","name":"Cooler: Passion fruit 500ml","price":45}];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const R=n=>"R"+(Math.round((n||0)*100)/100).toLocaleString();
const TABS={menu:"Menu",stock:"Stock",report:"Report",act:"Activity",set:"Settings"};
let S={menu:{},stock:{},purch:{},daily:{},act:{},sold:{},set:{}},tab="menu",editing=null,month=new Date().toISOString().slice(0,7),who_f="";
// theme
const th=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
document.documentElement.dataset.theme=th;
$("tg").onclick=()=>{const t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;localStorage.setItem("theme",t)};
// who + activity log
const who=()=>{let w=localStorage.getItem("who");if(!w){w=(prompt("Your first name (saved with every change)?")||"").trim()||"Unknown";localStorage.setItem("who",w)}return w};
const log=what=>db.ref("activity").push({who:who(),what,ts:firebase.database.ServerValue.TIMESTAMP});
// login
$("go").onclick=()=>firebase.auth().signInWithEmailAndPassword($("em").value.trim(),$("pw").value).catch(()=>{$("lm").textContent="Wrong email or password"});
$("pw").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
firebase.auth().onAuthStateChanged(u=>{
  $("login").hidden=!!u;$("app").hidden=!u;if(!u)return;
  [["menu","menu"],["stock","stock"],["purch","purchases"],["daily","daily"],["sold","soldout"],["set","settings"]].forEach(([k,p])=>db.ref(p).on("value",sn=>{S[k]=sn.val()||{};draw()}));
  db.ref("activity").limitToLast(100).on("value",sn=>{S.act=sn.val()||{};draw()});
});
function nav(){$("tabs").innerHTML=Object.keys(TABS).map(k=>`<button data-t="${k}" class="${k===tab?"on":""}">${TABS[k]}</button>`).join("")}
$("tabs").onclick=e=>{const b=e.target.closest("[data-t]");if(b){tab=b.dataset.t;draw()}};
function draw(){
  if(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)&&document.activeElement.closest("#view")&&tab!=="menu"&&tab!=="report")return;
  $("biz").textContent=S.set.business||"Shop admin";nav();
  $("view").innerHTML=({menu:vMenu,stock:vStock,report:vReport,act:vAct,set:vSet})[tab]();
}
const stockOpts=sel=>`<option value="">Not tracked</option>`+Object.entries(S.stock).map(([k,s])=>`<option value="${k}"${k===sel?" selected":""}>${esc(s.name)}</option>`).join("");
// ---------- MENU ----------
function vMenu(){
  const items=Object.entries(S.menu).map(([id,d])=>({id,...d})).sort((a,b)=>(a.order||0)-(b.order||0));
  const e=editing&&S.menu[editing]?S.menu[editing]:{},su=e.uses?Object.keys(e.uses)[0]:"";
  const cats=[...new Set(items.map(d=>d.cat))];
  let h=`<div class="card"><h2>${editing?"Edit item":"Add an item"}</h2><div class="row">
  <div><label for="mn">Name</label><input id="mn" value="${esc(e.name)}"></div>
  <div><label for="mp">Price (R)</label><input id="mp" type="number" min="0" step="0.5" value="${e.price??""}"></div>
  <div><label for="mc">Section</label><input id="mc" list="cl" value="${esc(e.cat)}"><datalist id="cl">${cats.map(c=>`<option>${esc(c)}`).join("")}</datalist></div></div>
  <div class="row"><div><label for="ms">Counts down this stock item</label><select id="ms">${stockOpts(su)}</select></div>
  <div><label for="mq">Used per sale</label><input id="mq" type="number" min="0" step="0.1" value="${su?e.uses[su]:1}"></div></div>
  <p><button class="b" id="msave">${editing?"Save changes":"Add item"}</button> ${editing?`<button class="g" id="mcancel">Cancel</button>`:""}</p></div>`;
  if(!items.length)return h+`<div class="card"><h2>Your menu lives in the code right now</h2><p>Load it into the database once, then manage it here. The counter keeps working from its built-in list until you do.</p><button class="b" id="mimport">Load current menu (${STARTER.length} items)</button></div>`;
  [...new Set(items.map(d=>d.cat))].forEach(c=>{h+=`<div class="card"><h2>${esc(c)}</h2>`+items.filter(d=>d.cat===c).map(d=>`<div class="item ${d.active===false?"off":""}"><div class="n"><b>${esc(d.name)}</b> ${R(d.price)}<small>${d.active===false?"Archived":S.sold[d.id]?"Sold out":"On the menu"}${d.uses?" · counts down "+esc((S.stock[Object.keys(d.uses)[0]]||{}).name||"stock"):""}</small></div>
  <button class="g" data-a="sold" data-id="${d.id}">${S.sold[d.id]?"Back in stock":"Sold out"}</button><button class="g" data-a="edit" data-id="${d.id}">Edit</button><button class="g" data-a="arch" data-id="${d.id}">${d.active===false?"Restore":"Archive"}</button></div>`).join("")+`</div>`});
  return h;
}
// ---------- STOCK ----------
function vStock(){
  const rows=Object.entries(S.stock).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  let h=`<div class="card"><h2>Add a stock item</h2><div class="row"><div><label for="sn">Name</label><input id="sn" placeholder="Burger buns"></div>
  <div><label for="su">Unit</label><input id="su" value="pcs"></div><div><label for="sl">Warn me at</label><input id="sl" type="number" min="0" value="10"></div><div><label for="sq">Count now</label><input id="sq" type="number" min="0" value="0"></div></div>
  <p><button class="b" id="sadd">Add stock item</button></p></div><div class="card"><h2>Stock on hand</h2>`;
  if(!rows.length)h+=`<div class="empty">No stock items yet. Add buns, patties, bags or cold drinks above.</div>`;
  h+=rows.map(([id,s])=>{const low=(s.qty||0)<=(s.low||0);return `<div class="item"><div class="n"><b>${esc(s.name)}</b><small>${low?`<span class="low">Running low</span> · `:""}warns at ${s.low||0} ${esc(s.unit)}${s.cost?" · last cost "+R(s.cost)+" each":""}</small></div>
  <div class="big ${low?"low":""}">${Math.round((s.qty||0)*100)/100}</div>
  <input style="width:80px" id="rq-${id}" type="number" min="0" placeholder="Qty"><input style="width:90px" id="rc-${id}" type="number" min="0" placeholder="Paid R">
  <button class="b" data-a="restock" data-id="${id}">Restock</button><button class="g" data-a="fix" data-id="${id}">Fix count</button></div>`}).join("")+`</div>`;
  return h;
}
// ---------- REPORT ----------
function vReport(){
  const inM=k=>k.startsWith(month);
  const sales=Object.entries(S.daily).filter(([k])=>inM(k)).reduce((s,[,d])=>s+(d.sales||0),0);
  const orders=Object.entries(S.daily).filter(([k])=>inM(k)).reduce((s,[,d])=>s+(d.orders||0),0);
  const pur=Object.values(S.purch).filter(p=>new Date(p.ts).toISOString().slice(0,7)===month).sort((a,b)=>b.ts-a.ts);
  const spent=pur.reduce((s,p)=>s+(p.cost||0),0),left=Object.values(S.stock).reduce((s,x)=>s+(x.qty||0)*(x.cost||0),0);
  const cur=month===new Date().toISOString().slice(0,7);
  return `<div class="card"><label for="mo">Month</label><input id="mo" type="month" value="${month}" style="max-width:200px">
  <div class="stats" style="margin-top:12px"><div><span>Sales</span><div class="big">${R(sales)}</div></div><div><span>Stock bought</span><div class="big">${R(spent)}</div></div>
  <div><span>Profit</span><div class="big ${sales-spent<0?"low":""}">${R(sales-spent)}</div></div><div><span>Orders</span><div class="big">${orders}</div></div></div>
  ${sales?`<p>Margin on sales: <b>${Math.round((sales-spent)/sales*100)}%</b></p>`:""}
  ${cur?`<p>Stock still on the shelf is worth about <b>${R(left)}</b>, so profit after counting what is left is about <b>${R(sales-spent+left)}</b>.</p>`:""}</div>
  <div class="card"><h2>Stock bought this month</h2>${pur.length?pur.map(p=>`<div class="item"><div class="n"><b>${esc(p.name)}</b> × ${p.qty}<small>${new Date(p.ts).toLocaleDateString()} · ${esc(p.who)}</small></div><b>${R(p.cost)}</b></div>`).join(""):`<div class="empty">Nothing bought yet. Use Restock on the Stock tab.</div>`}</div>`;
}
// ---------- ACTIVITY ----------
function vAct(){
  const a=Object.values(S.act).sort((x,y)=>y.ts-x.ts),names=[...new Set(a.map(x=>x.who))];
  const f=who_f?a.filter(x=>x.who===who_f):a;
  return `<div class="card"><label for="wf">Show changes by</label><select id="wf" style="max-width:240px"><option value="">Everyone</option>${names.map(n=>`<option${n===who_f?" selected":""}>${esc(n)}</option>`).join("")}</select></div>
  <div class="card">${f.length?f.map(x=>`<div class="item"><div class="n"><b>${esc(x.who)}</b> ${esc(x.what)}<small>${new Date(x.ts).toLocaleString()}</small></div></div>`).join(""):`<div class="empty">No changes recorded yet.</div>`}</div>`;
}
// ---------- SETTINGS ----------
function vSet(){return `<div class="card"><h2>Settings</h2><label for="yn">Your name (saved with each change)</label><input id="yn" value="${esc(localStorage.getItem("who")||"")}">
  <label for="bn">Business name</label><input id="bn" value="${esc(S.set.business||"")}"><p><button class="b" id="setsave">Save settings</button></p>
  <p><button class="g" id="so">Sign out</button></p></div>`}
// ---------- ACTIONS ----------
const num=id=>parseFloat($(id).value)||0;
document.addEventListener("click",async e=>{
  const t=e.target;if(!t.closest("#view"))return;const id=t.id,a=t.dataset.a,k=t.dataset.id;
  if(id==="mimport"){const o={};STARTER.forEach((d,i)=>{const{id:x,...r}=d;o[x]={...r,order:i,active:true}});await db.ref("menu").set(o);log("loaded the starting menu ("+STARTER.length+" items)")}
  if(id==="msave"){const name=$("mn").value.trim(),cat=$("mc").value.trim();if(!name||!cat){alert("Give the item a name and a section.");return}
    const sid=$("ms").value,d={name,cat,price:num("mp"),uses:sid?{[sid]:num("mq")||1}:null},key=editing||"m"+Date.now().toString(36);
    if(!editing){d.active=true;d.order=Math.max(0,...Object.values(S.menu).map(x=>x.order||0))+1}
    await db.ref("menu/"+key).update(d);log((editing?"changed ":"added ")+name+" at "+R(d.price));editing=null;draw()}
  if(id==="mcancel"){editing=null;draw()}
  if(a==="edit"){editing=k;draw();scrollTo(0,0)}
  if(a==="sold"){await db.ref("soldout/"+k).set(S.sold[k]?null:true);log((S.sold[k]?"put back in stock: ":"marked sold out: ")+S.menu[k].name)}
  if(a==="arch"){const on=S.menu[k].active===false;await db.ref("menu/"+k+"/active").set(on);log((on?"restored ":"archived ")+S.menu[k].name)}
  if(id==="sadd"){const name=$("sn").value.trim();if(!name){alert("Give the stock item a name.");return}
    await db.ref("stock").push({name,unit:$("su").value.trim()||"pcs",low:num("sl"),qty:num("sq")});log("added stock item "+name)}
  if(a==="restock"){const q=num("rq-"+k),c=num("rc-"+k);if(q<=0){alert("Enter how many you bought.");return}const s=S.stock[k];
    await db.ref("stock/"+k+"/qty").transaction(n=>(n||0)+q);if(c>0)await db.ref("stock/"+k+"/cost").set(Math.round(c/q*100)/100);
    await db.ref("purchases").push({itemId:k,name:s.name,qty:q,cost:c,who:who(),ts:firebase.database.ServerValue.TIMESTAMP});log("restocked "+q+" "+s.name+(c?" for "+R(c):""))}
  if(a==="fix"){const v=prompt("Count right now for "+S.stock[k].name+"?",S.stock[k].qty);if(v===null||isNaN(parseFloat(v)))return;
    await db.ref("stock/"+k+"/qty").set(parseFloat(v));log("fixed count of "+S.stock[k].name+" from "+S.stock[k].qty+" to "+parseFloat(v))}
  if(id==="setsave"){localStorage.setItem("who",$("yn").value.trim()||"Unknown");await db.ref("settings/business").set($("bn").value.trim()||null);alert("Saved.")}
  if(id==="so")firebase.auth().signOut().then(()=>location.reload());
});
document.addEventListener("change",e=>{if(e.target.id==="mo"){month=e.target.value||month;draw()}if(e.target.id==="wf"){who_f=e.target.value;draw()}});
</script></body></html>
