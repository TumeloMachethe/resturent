<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop admin</title>
<style>
:root{--bg:#eef1ef;--card:#fff;--ink:#16211d;--mute:#5d6b65;--line:#d5ddd9;--acc:#e0a800;--accink:#1c1600;--bad:#b3261e;--ok:#1b7f4b}
:root[data-theme=dark]{--bg:#11171a;--card:#1a2327;--ink:#e8eeea;--mute:#98a8a1;--line:#2c3a40;--acc:#f0bc2a;--accink:#1c1600;--bad:#ff8a80;--ok:#6fd49c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px}
nav button{border:0;background:none;color:var(--mute);padding:10px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);color:var(--accink)}
main{max-width:860px;margin:0 auto;padding:8px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
h2{font-size:17px;margin:4px 0 10px}h3{font-size:15px;margin:16px 0 6px;color:var(--mute)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:110px}
button.b{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:var(--accink)}
button.g,a.g{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
button.r{border:1px solid var(--bad);background:none;color:var(--bad);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;font-weight:600;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:0}.item .n{flex:1;min-width:150px}.item small{color:var(--mute);display:block}
.low{color:var(--bad);font-weight:700}.off{opacity:.5}
.big{font-size:26px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stats div{background:var(--bg);border-radius:8px;padding:10px}.stats span{font-size:13px;color:var(--mute)}
.empty{color:var(--mute);padding:18px 0;text-align:center}
.rs{flex-basis:100%;background:var(--bg);border-radius:8px;padding:8px 10px}
.rs summary{cursor:pointer;color:var(--mute);font-size:14px}
.pv{min-height:1.4em;margin:6px 0 0;font-weight:600;color:var(--ok)}
.warnbox{border:1px solid var(--bad);background:var(--card)}
.warnbox h2{color:var(--bad)}
#login{max-width:340px;margin:12vh auto;padding:0 16px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);max-width:92vw;background:var(--ok);color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50}
#toast.show{opacity:1}#toast.bad{background:var(--bad)}
.printonly{display:none}
@media print{
:root[data-theme]{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#ccc;--bad:#b3261e;--ok:#1b7f4b}
header,nav,.noprint,#toast{display:none!important}
.printonly{display:block}
body{background:#fff}main{max-width:none;padding:0}.card{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

,"grp":"Mixed berry smoothie","size":"350ml","name":"Smoothie: Mixed berry smoothie 350ml","price":55},{"id":"smo9","cat":"Smoothies","grp":"Mixed berry smoothie","size":"500ml","name":"Smoothie: Mixed berry smoothie 500ml","price":65},{"id":"smo10","cat":"Smoothies","grp":"Mango & apple smoothie","size":"350ml","name":"Smoothie: Mango & apple smoothie 350ml","price":45},{"id":"smo11","cat":"Smoothies","grp":"Mango & apple smoothie","size":"500ml","name":"Smoothie: Mango & apple smoothie 500ml","price":55},{"id":"smo12","cat":"Smoothies","grp":"Coconut butter smoothie","size":"350ml","name":"Smoothie: Coconut butter smoothie 350ml","price":50},{"id":"smo13","cat":"Smoothies","grp":"Coconut butter smoothie","size":"500ml","name":"Smoothie: Coconut butter smoothie 500ml","price":55},{"id":"mil0","cat":"Milkshakes","grp":"Blueberry","size":"350ml","name":"Milkshake: Blueberry 350ml","price":40},{"id":"mil1","cat":"Milkshakes","grp":"Blueberry","size":"500ml","name":"Milkshake: Blueberry 500ml","price":50},{"id":"mil2","cat":"Milkshakes","grp":"Strawberry","size":"350ml","name":"Milkshake: Strawberry 350ml","price":40},{"id":"mil3","cat":"Milkshakes","grp":"Strawberry","size":"500ml","name":"Milkshake: Strawberry 500ml","price":50},{"id":"mil4","cat":"Milkshakes","grp":"Lime","size":"350ml","name":"Milkshake: Lime 350ml","price":40},{"id":"mil5","cat":"Milkshakes","grp":"Lime","size":"500ml","name":"Milkshake: Lime 500ml","price":50},{"id":"mil6","cat":"Milkshakes","grp":"Chocolate","size":"350ml","name":"Milkshake: Chocolate 350ml","price":40},{"id":"mil7","cat":"Milkshakes","grp":"Chocolate","size":"500ml","name":"Milkshake: Chocolate 500ml","price":50},{"id":"mil8","cat":"Milkshakes","grp":"Bubblegum","size":"350ml","name":"Milkshake: Bubblegum 350ml","price":40},{"id":"mil9","cat":"Milkshakes","grp":"Bubblegum","size":"500ml","name":"Milkshake: Bubblegum 500ml","price":50},{"id":"coo0","cat":"Coolers","grp":"Lemonade & mint","size":"350ml","name":"Cooler: Lemonade & mint 350ml","price":35},{"id":"coo1","cat":"Coolers","grp":"Lemonade & mint","size":"500ml","name":"Cooler: Lemonade & mint 500ml","price":45},{"id":"coo2","cat":"Coolers","grp":"Granadilla","size":"350ml","name":"Cooler: Granadilla 350ml","price":35},{"id":"coo3","cat":"Coolers","grp":"Granadilla","size":"500ml","name":"Cooler: Granadilla 500ml","price":45},{"id":"coo4","cat":"Coolers","grp":"Raspberry","size":"350ml","name":"Cooler: Raspberry 350ml","price":35},{"id":"coo5","cat":"Coolers","grp":"Raspberry","size":"500ml","name":"Cooler: Raspberry 500ml","price":45},{"id":"coo6","cat":"Coolers","grp":"Strawberry","size":"350ml","name":"Cooler: Strawberry 350ml","price":35},{"id":"coo7","cat":"Coolers","grp":"Strawberry","size":"500ml","name":"Cooler: Strawberry 500ml","price":45},{"id":"coo8","cat":"Coolers","grp":"Passion fruit","size":"350ml","name":"Cooler: Passion fruit 350ml","price":35},{"id":"coo9","cat":"Coolers","grp":"Passion fruit","size":"500ml","name":"Cooler: Passion fruit 500ml","price":45}];

const R=n=>{const v=Math.round((n||0)*100)/100,[i,d]=Math.abs(v).toFixed(2).split(".");return (v<0?"-":"")+"R"+i.replace(/\B(?=(\d{3})+(?!\d))/g,"\u00a0")+"."+d};
const TABS={menu:"Menu",stock:"Stock",report:"Report",act:"Activity",set:"Settings"};
let S={menu:{},stock:{},purch:{},daily:{},act:{},sold:{},set:{},give:{}},tab="menu",editing=null,draft=null,month=new Date().toISOString().slice(0,7),who_f="";
// pop-up message after an action
function toast(m,bad){const t=$("toast");t.textContent=m;t.className="show"+(bad?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(()=>{t.className=""},3500)}
// theme

firebase.auth().onAuthStateChanged(u=>{

  [["menu","menu"],["stock","stock"],["purch","purchases"],["daily","daily"],["sold","soldout"],["set","settings"],["give","giveaways"]].forEach(([k,p])=>db.ref(p).on("value",sn=>{S[k]=sn.val()||{};draw()}));

});
function nav(){$("tabs").innerHTML=Object.keys(TABS).map(k=>`<button data-t="${k}" class="${k===tab?"on":""}">${TABS[k]}</button>`).join("")}

  const nameCard=localStorage.getItem("who")?"":`<div class="card noprint"><h2>What is your first name?</h2><p>It is saved with every change you make.</p><div class="row"><div><label for="yn2">First name</label><input id="yn2"></div><div style="flex:0 0 auto;min-width:0"><button class="b" id="namesave">Save</button></div></div></div>`;
  $("view").innerHTML=nameCard+({menu:vMenu,stock:vStock,report:vReport,act:vAct,set:vSet})[tab]();
}
// ---------- GIVE AWAY OR WASTE A DISH ----------
let gv={dish:"",n:"1",why:"Staff meal"},lastGive=null,inl=null;
const inlineForm=(id,s)=>inl.t==="grp"
  ?`<div class="rs"><div class="row"><div><label for="ge">Group for ${esc(s.name)} (leave empty for none)</label><input id="ge" list="sgl" value="${esc(s.grp||"")}" placeholder="Bread, Meat, Drinks"></div><div style="flex:0 0 auto;min-width:0"><button class="b" data-a="grpsave" data-id="${id}">Save</button> <button class="g" data-a="inlcancel">Cancel</button></div></div></div>`
  :`<div class="rs"><div class="row"><div><label for="fe">Count right now for ${esc(s.name)}</label><input id="fe" type="number" min="0" step="any" value="${esc(s.qty||0)}"></div><div style="flex:0 0 auto;min-width:0"><button class="b" data-a="fixsave" data-id="${id}">Save</button> <button class="g" data-a="inlcancel">Cancel</button></div></div></div>`;
const GIVE_WHY=["Staff meal","Free gift or promo","Customer complaint","Dropped or spoiled","Other"];
function giveLines(){const d=S.menu[gv.dish],n=parseFloat(gv.n)||0;if(!d||!d.uses||n<=0)return[];return Object.entries(d.uses).map(([k,q])=>({k,s:S.stock[k],need:r2(q*n)})).filter(x=>x.s&&x.s.name)}
function givePv(){const d=S.menu[gv.dish];if(!d)return "";if(!d.uses)return `<span class="low">No stock items linked to this dish. Edit it on the Menu tab first.</span>`;

  <div><label for="gr">Reason</label><select id="gr">${GIVE_WHY.map(w=>`<option${w===gv.why?" selected":""}>${w}</option>`).join("")}</select></div></div>

const stockGroups=()=>[...new Set(Object.values(S.stock).filter(s=>s&&s.name&&s.grp).map(s=>s.grp))].sort((a,b)=>a.localeCompare(b));

const stockOpts=sel=>`<option value="">Not tracked</option>`+stockList().sort((a,b)=>((a[1].grp||"~")+a[1].name).localeCompare((b[1].grp||"~")+b[1].name)).map(([k,s])=>`<option value="${k}"${k===sel?" selected":""}>${s.grp?esc(s.grp)+" - ":""}${esc(s.name)}</option>`).join("");

// ---------- MENU ----------

function vMenu(){
  if(!draft)initDraft();

  const useRows=draft.uses.map((u,i)=>`<div class="row"><div><label for="us${i}">Stock item</label><select id="us${i}" class="us" data-i="${i}">${stockOpts(u.s)}</select></div>

  <p><button class="g" data-a="adduse">+ Add another stock item</button></p>
  <p><button class="b" id="msave">${editing?"Save changes":"Add item"}</button> ${editing?`<button class="g" id="mcancel">Cancel</button>`:""}</p></div>`;
  if(!items.length)return h+`<div class="card"><h2>Your menu lives in the code right now</h2><p>Load it into the database once, then manage it here. The counter keeps working from its built-in list until you do.</p><button class="b" id="mimport">Load current menu (${STARTER.length} items)</button></div>`;

// ---------- REPORT ----------
let rmode="month";
const utcDay=d=>new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
function isoWeekOf(d){d=new Date(d);d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));const y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));return d.getUTCFullYear()+"-W"+String(Math.ceil(((d-y0)/864e5+1)/7)).padStart(2,"0")}
function weekRange(w){const m=/^(\d{4})-W(\d{2})$/.exec(w||"");if(!m)return null;const j=new Date(Date.UTC(+m[1],0,4)),mon=new Date(j);mon.setUTCDate(j.getUTCDate()-((j.getUTCDay()+6)%7)+(+m[2]-1)*7);const sun=new Date(mon);sun.setUTCDate(mon.getUTCDate()+6);return[mon,sun]}
let week=isoWeekOf(utcDay(new Date()));
const dstr=d=>d.toISOString().slice(0,10);
const dnice=d=>d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});
function printReport(){const old=document.title;document.title=($("biz").textContent||"Shop")+" "+(rmode==="week"?"weekly report "+week:"monthly report "+month);window.print();setTimeout(()=>{document.title=old},1500)}
function vReport(){
  const todayS=new Date().toISOString().slice(0,10);
  let inD,inTs,label,noun,pick,cur;
  if(rmode==="week"){
    const r=weekRange(week)||weekRange(isoWeekOf(utcDay(new Date()))),a=dstr(r[0]),b=dstr(r[1]);
    inD=k=>k>=a&&k<=b;inTs=ts=>{const x=new Date(ts).toISOString().slice(0,10);return x>=a&&x<=b};
    label="Week "+week.split("-W")[1]+": "+dnice(r[0])+" to "+dnice(r[1]);noun="this week";cur=todayS>=a&&todayS<=b;
    pick=`<div class="row"><div><label for="wk">Week</label><input id="wk" type="week" value="${week}"></div><div style="flex:0 0 auto;min-width:0"><button class="g" data-a="wprev">&larr; Previous</button> <button class="g" data-a="wnow">This week</button> <button class="g" data-a="wnext">Next &rarr;</button></div></div>`;
  }else{
    inD=k=>k.startsWith(month);inTs=ts=>new Date(ts).toISOString().slice(0,7)===month;
    const [y,m]=month.split("-");label=new Date(Date.UTC(+y,+m-1,1)).toLocaleDateString(undefined,{month:"long",year:"numeric",timeZone:"UTC"});noun="this month";cur=month===todayS.slice(0,7);
    pick=`<label for="mo">Month</label><input id="mo" type="month" value="${month}" style="max-width:200px">`;
  }
  const sales=Object.entries(S.daily).filter(([k])=>inD(k)).reduce((s,[,d])=>s+(d.sales||0),0);
  const orders=Object.entries(S.daily).filter(([k])=>inD(k)).reduce((s,[,d])=>s+(d.orders||0),0);
  const pur=Object.values(S.purch).filter(p=>p&&p.ts&&inTs(p.ts)).sort((a,b)=>b.ts-a.ts);
  const spent=pur.reduce((s,p)=>s+(p.cost||0),0),left=Object.values(S.stock).reduce((s,x)=>s+(x.qty||0)*(x.cost||0),0);
  const gl=Object.values(S.give).filter(g=>g&&g.ts&&inTs(g.ts)),lost=r2(gl.reduce((t,g)=>t+(g.cost||0),0)),byWhy={};
  gl.forEach(g=>{const w=g.why||"Other";byWhy[w]=byWhy[w]||{c:0,n:0};byWhy[w].c+=g.cost||0;byWhy[w].n++});
  return `<div class="card noprint"><div class="row"><div><label for="rm">Report type</label><select id="rm"><option value="month"${rmode==="month"?" selected":""}>Monthly report</option><option value="week"${rmode==="week"?" selected":""}>Weekly report</option></select></div><div style="flex:0 0 auto;min-width:0"><button class="b" id="pdf">Download PDF</button></div></div>${pick}</div>
  <div class="printonly"><h1 style="font-size:22px;margin:0 0 4px">${esc(S.set.business||"Shop")}: ${rmode==="week"?"weekly":"monthly"} report</h1><p style="margin:0 0 8px">${esc(label)} &middot; made on ${new Date().toLocaleDateString()} by ${esc(who())}</p></div>
  <div class="card"><h2>${esc(label)}</h2>
  <div class="stats"><div><span>Sales</span><div class="big">${R(sales)}</div></div><div><span>Stock bought</span><div class="big">${R(spent)}</div></div>
  <div><span>Sales minus stock bought</span><div class="big ${sales-spent<0?"low":""}">${R(sales-spent)}</div></div><div><span>Profit after leftover stock (estimate)</span><div class="big ${sales-spent+left<0?"low":""}">${R(sales-spent+left)}</div></div><div><span>Stock lost or given away</span><div class="big ${lost>0?"low":""}">${R(lost)}</div></div><div><span>Orders</span><div class="big">${orders}</div></div></div>
  ${sales?`<p>Margin on sales: <b>${Math.round((sales-spent+left)/sales*100)}%</b> after leftover stock</p>`:""}
  <p style="color:var(--mute);font-size:14px">Sales minus stock bought can look like a loss in a ${rmode==="week"?"week":"month"} when you restock heavily. Stock still on the shelf is worth about <b>${R(left)}</b> at today's counts and last costs, so the second figure is a fairer picture of profit. ${cur?"":"For past periods it is only an estimate, because it uses today's shelf value."}</p></div>
  <div class="card"><h2>Stock lost or given away ${noun}</h2>${gl.length?Object.entries(byWhy).sort((a,b)=>b[1].c-a[1].c).map(([w,x])=>`<div class="item"><div class="n"><b>${esc(w)}</b><small>${x.n} time${x.n===1?"":"s"}</small></div><b>${R(x.c)}</b></div>`).join("")+`<div class="item"><div class="n"><b>Total</b></div><b>${R(lost)}</b></div>`:`<div class="empty">Nothing given away or wasted ${noun}.</div>`}</div>
  <div class="card"><h2>Stock bought ${noun}</h2>${pur.length?pur.map(p=>`<div class="item"><div class="n"><b>${esc(p.name)}</b> × ${p.qty}<small>${new Date(p.ts).toLocaleDateString()} · ${esc(p.who)}</small></div><b>${R(p.cost)}</b></div>`).join(""):`<div class="empty">Nothing bought ${noun}. Use Restock on the Stock tab.</div>`}</div>`;
}

  if(a==="inlcancel"){inl=null;draw()}
  if(a==="grpsave"){const s=S.stock[k],v=$("ge").value.trim();inl=null;

  }catch(err){toast("That did not work: "+err.message,true)}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.id==="ge"||e.target.id==="fe")){const b=document.querySelector('[data-a="grpsave"],[data-a="fixsave"]');if(b)b.click()}});
document.addEventListener("change",e=>{
  if(e.target.id==="gd"){gv.dish=e.target.value;$("gpv").innerHTML=givePv()}
  if(e.target.id==="gr")gv.why=e.target.value;
  if(e.target.id==="rm"){rmode=e.target.value;draw()}
  if(e.target.id==="wk"&&weekRange(e.target.value)){week=e.target.value;draw()}
  if(e.target.id==="mo"){month=e.target.value||month;draw()}
  if(e.target.id==="wf"){who_f=e.target.value;draw()}
  if(e.target.classList.contains("us")&&draft)draft.uses[+e.target.dataset.i].s=e.target.value;
});
</script></body></html>
